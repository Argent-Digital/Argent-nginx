server {
    listen 80;
    server_name key.argentvpn.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name key.argentvpn.ru;

    ssl_certificate /etc/letsencrypt/live/key.argentvpn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/key.argentvpn.ru/privkey.pem;

    # Проксирование запросов подписки на 3X-UI (порт 2096)
    location /sub/ {
        proxy_pass http://172.17.0.1:2096/sub/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}