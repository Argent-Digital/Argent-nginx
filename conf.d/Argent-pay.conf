server {
    listen 80;
    server_name argent-pay-1.argentvpn.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name argent-pay-1.argentvpn.ru;

    # Пути к общему сертификату
    ssl_certificate /etc/letsencrypt/live/argent-vpn-manager-1.argentvpn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/argent-vpn-manager-1.argentvpn.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=30s;

    # Вебхук ЮКассы — защищаем белым списком IP на уровне SSL
    location /yookassa_webhook {
        set $pay_backend "http://argent-pay-service:8000";
        proxy_pass $pay_backend;

        # Сюда пускаем только ЮКассу и локалхост
        allow 185.71.76.0/27;
        allow 185.71.77.0/27;
        allow 77.75.153.0/25;
        allow 77.75.154.128/25;
        allow 77.75.156.0/24;
        allow 127.0.0.1; 
        deny all;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        set $pay_backend "http://argent-pay-service:8000/docs";
        proxy_pass $pay_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $pay_backend "http://argent-pay-service:8000";
        proxy_pass $pay_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}