server {
    listen 80;
    server_name argent-bot-1.argentvpn.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name argent-bot-1.argentvpn.ru;

    # Пути к нашему общему сертификату Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/argent-vpn-manager-1.argentvpn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/argent-vpn-manager-1.argentvpn.ru/privkey.pem;

    # Базовые настройки безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Твой докер-резолвер для динамических апстримов
    resolver 127.0.0.11 valid=30s;

    location /docs {
        set $pay_backend "http://argent-bot-service:8000/docs";
        proxy_pass $pay_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $core_backend "http://argent-bot-service:8000";
        proxy_pass $core_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}